name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  RETENTION_DAYS: "30"

jobs:
  source-gate:
    name: Source gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - run: npm ci

      - name: Verify tag and source revision
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Generation gate
        run: npm run contracts:check && npm run sdk:check && npm run docs:check

      - name: Typecheck gate
        run: npm run typecheck

      - name: Typed lint gate
        run: npm run lint

      - name: Unit test gate
        run: npm run test:unit -- tests/openapi-authoritative-contract.test.ts

      - name: State test gate
        run: npx vitest run tests/state-machines.test.ts

      - name: Webhook test gate
        run: npx vitest run tests/webhooks.test.ts tests/webhook-adapters.test.ts tests/webhook-types.test.ts

      - name: Framework test gate
        run: npx vitest run tests/webhook-express.integration.test.ts

      - name: Coverage gate
        run: npm run test:coverage

      - name: Format gate
        run: npx prettier --check "src/**/*.ts" "tests/**/*.ts"

      - name: Test policy gate
        run: npm run test:policy

      - name: Repository secret-scan gate
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFile } from "node:fs/promises";
          import { SECRET_PATTERNS } from "./scripts/secret-patterns.mjs";

          const policy = JSON.parse(await readFile("security/secret-scan-allowlist.json", "utf8"));
          const allowed = new Set(policy.rules.map((rule) => rule.allowedPath));
          const paths = execFileSync("git", ["ls-files", "-z"], { encoding: "utf8" })
            .split("\0")
            .filter(Boolean);
          for (const path of paths) {
            if (allowed.has(path)) continue;
            const source = await readFile(path, "utf8");
            if (SECRET_PATTERNS.some((pattern) => pattern.test(source))) {
              throw new TypeError(`Repository contains an unclassified secret in ${path}.`);
            }
          }
          NODE

      - name: Audit gate
        run: npm run verify:audit

      - name: Create detached source report
        run: |
          mkdir -p /tmp/source-report
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { canonicalizeJson, sha256Hex } from "./scripts/digest-artifact.mjs";
          import {
            readRepositorySourceBindings,
            REQUIRED_SOURCE_GATES,
            validateSourceGateReport,
          } from "./scripts/run-source-gates.mjs";

          const bindings = await readRepositorySourceBindings();
          const source = canonicalizeJson({
            version: 1,
            ...bindings,
            results: REQUIRED_SOURCE_GATES.map((name) => ({ name, passed: true })),
          });
          const sidecar = Buffer.from(`${sha256Hex(source)}\n`, "utf8");
          validateSourceGateReport({
            reportSource: source,
            reportSidecar: sidecar,
            expectedBindings: bindings,
          });
          await Promise.all([
            writeFile("/tmp/source-report/source-report.json", source, { flag: "wx" }),
            writeFile("/tmp/source-report/source-report.sha256", sidecar, { flag: "wx" }),
          ]);
          NODE

      - name: Documentation workflow gate
        run: |
          npm run test:docs:workflows:source -- \
            /tmp/source-report/source-report.json \
            /tmp/source-report/source-report.sha256 \
            /tmp/source-report/documentation-workflows.json \
            /tmp/source-report/documentation-workflows.sha256

      - name: Retain provenance verification tools
        run: |
          mkdir -p /tmp/release-tools/scripts
          cp scripts/digest-artifact.mjs /tmp/release-tools/scripts/
          cp scripts/promote-latest.mjs /tmp/release-tools/scripts/
          cp scripts/report-validation.mjs /tmp/release-tools/scripts/
          cp scripts/restore-latest.mjs /tmp/release-tools/scripts/
          cp scripts/verify-provenance.mjs /tmp/release-tools/scripts/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-report
          path: |
            /tmp/source-report/source-report.json
            /tmp/source-report/source-report.sha256
            /tmp/source-report/documentation-workflows.json
            /tmp/source-report/documentation-workflows.sha256
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tools
          path: /tmp/release-tools
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

  candidate:
    name: Build candidate once
    needs: source-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-report
          path: /tmp/source-report

      - name: Build and pack the retained candidate
        run: |
          node scripts/create-candidate.mjs \
            /tmp/source-report/source-report.json \
            /tmp/candidate \
            /tmp/source-report/source-report.sha256
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          SHA256="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/candidate/candidate-manifest.json')).tarballSha256")"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "$TARBALL")" = "$SHA256"
          printf '%s\n' "$SHA256" > "$TARBALL.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-tarball
          path: |
            /tmp/candidate/*.tgz
            /tmp/candidate/*.tgz.sha256
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-manifest
          path: |
            /tmp/candidate/candidate-manifest.json
            /tmp/candidate/candidate-manifest.sha256
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

  artifact-gates:
    name: Artifact gates (Node ${{ matrix.node }})
    needs: candidate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-tarball
          path: /tmp/candidate

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-manifest
          path: /tmp/candidate

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-report
          path: /tmp/source-report

      - name: Verify retained package artifact
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          SHA256="$(tr -d '\n' < "$TARBALL.sha256")"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "$TARBALL")" = "$SHA256"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" /tmp/candidate/candidate-manifest.json)" = "$(tr -d '\n' < /tmp/candidate/candidate-manifest.sha256)"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/candidate/candidate-manifest.json')).tarballSha256")" = "$SHA256"
          node scripts/verify-doc-workflows.mjs --artifact \
            "$TARBALL" \
            "$SHA256" \
            /tmp/source-report/source-report.json \
            /tmp/source-report/source-report.sha256 \
            /tmp/source-report/documentation-workflows.json \
            /tmp/source-report/documentation-workflows.sha256

  runtime-workerd:
    name: Retained candidate workerd conformance
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-tarball
          path: /tmp/candidate

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-manifest
          path: /tmp/candidate

      - name: Run workerd against the retained candidate
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          SHA256="$(tr -d '\n' < "$TARBALL.sha256")"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "$TARBALL")" = "$SHA256"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" /tmp/candidate/candidate-manifest.json)" = "$(tr -d '\n' < /tmp/candidate/candidate-manifest.sha256)"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/candidate/candidate-manifest.json')).tarballSha256")" = "$SHA256"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/candidate/candidate-manifest.json')).commit")" = "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/ahasend-workerd-candidate"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/ahasend-workerd-candidate"
          test ! -e dist
          cp -R "$RUNNER_TEMP/ahasend-workerd-candidate/package/dist" dist
          npm run test:conformance:workerd:artifact

  runtime-deno:
    name: Retained candidate Deno 2.x smoke
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - run: npm ci

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: 2.x

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-tarball
          path: /tmp/candidate

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-manifest
          path: /tmp/candidate

      - name: Run Deno against the retained candidate
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          SHA256="$(tr -d '\n' < "$TARBALL.sha256")"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "$TARBALL")" = "$SHA256"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" /tmp/candidate/candidate-manifest.json)" = "$(tr -d '\n' < /tmp/candidate/candidate-manifest.sha256)"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/candidate/candidate-manifest.json')).tarballSha256")" = "$SHA256"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/candidate/candidate-manifest.json')).commit")" = "$GITHUB_SHA"
          npm run test:runtime:deno -- "$TARBALL"

  runtime-bun:
    name: Retained candidate Bun smoke
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - run: npm ci

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-tarball
          path: /tmp/candidate

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-manifest
          path: /tmp/candidate

      - name: Run Bun against the retained candidate
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          SHA256="$(tr -d '\n' < "$TARBALL.sha256")"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "$TARBALL")" = "$SHA256"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" /tmp/candidate/candidate-manifest.json)" = "$(tr -d '\n' < /tmp/candidate/candidate-manifest.sha256)"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/candidate/candidate-manifest.json')).tarballSha256")" = "$SHA256"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/candidate/candidate-manifest.json')).commit")" = "$GITHUB_SHA"
          npm run test:runtime:bun -- "$TARBALL"

  live-gates:
    name: Live candidate gates
    needs: [artifact-gates, runtime-workerd, runtime-deno, runtime-bun]
    runs-on: ubuntu-latest
    environment: live-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-tarball
          path: /tmp/candidate

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-manifest
          path: /tmp/candidate

      - name: Run live candidate acceptance
        env:
          AHASEND_API_KEY: ${{ secrets.AHASEND_API_KEY }}
          AHASEND_ACCOUNT_ID: ${{ secrets.AHASEND_ACCOUNT_ID }}
          AHASEND_LIVE_CONFIG_JSON: ${{ secrets.AHASEND_LIVE_CONFIG_JSON }}
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          export SDK_TARBALL="$TARBALL"
          export SDK_TARBALL_SHA256="$(tr -d '\n' < "$TARBALL.sha256")"
          mkdir -p /tmp/gate-report
          node scripts/run-live-acceptance.mjs \
            /tmp/candidate/candidate-manifest.json \
            "$TARBALL" \
            /tmp/live-install \
            /tmp/gate-report/live-report.json \
            /tmp/gate-report/live-report.sha256 \
            /tmp/candidate/candidate-manifest.sha256

      - name: Retain live report evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-report-evidence
          path: |
            /tmp/gate-report/live-report.json
            /tmp/gate-report/live-report.sha256
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

      - name: Create detached gate report
        if: ${{ success() }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          import { canonicalizeJson, sha256Hex } from "./scripts/digest-artifact.mjs";

          const manifestSource = await readFile("/tmp/candidate/candidate-manifest.json");
          const liveReportSource = await readFile("/tmp/gate-report/live-report.json");
          const liveReportSha256 = (
            await readFile("/tmp/gate-report/live-report.sha256", "utf8")
          ).trim();
          if (sha256Hex(liveReportSource) !== liveReportSha256) {
            throw new TypeError("Live report does not match its detached digest.");
          }
          const manifest = JSON.parse(manifestSource);
          const source = canonicalizeJson({
            version: 1,
            commit: manifest.commit,
            manifestSha256: sha256Hex(manifestSource),
            tarballSha256: manifest.tarballSha256,
            liveReportSha256,
            results: [
              { name: "artifact", passed: true },
              { name: "installed-documentation-links", passed: true },
              { name: "documentation-workflows", passed: true },
              { name: "workerd", passed: true },
              { name: "deno", passed: true },
              { name: "bun", passed: true },
              { name: "live", passed: true },
            ],
          });
          await Promise.all([
            writeFile("/tmp/gate-report/gate-report.json", source, { flag: "wx" }),
            writeFile(
              "/tmp/gate-report/gate-report.sha256",
              `${sha256Hex(source)}\n`,
              { flag: "wx" },
            ),
          ]);
          NODE

      - if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-report
          path: /tmp/gate-report
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

  next-publish:
    name: Publish candidate to next
    needs:
      [
        source-gate,
        candidate,
        artifact-gates,
        runtime-workerd,
        runtime-deno,
        runtime-bun,
        live-gates,
      ]
    runs-on: ubuntu-latest
    environment: npm-next
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-tarball
          path: /tmp/candidate

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-manifest
          path: /tmp/candidate

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gate-report
          path: /tmp/gate-report

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tools
          path: /tmp/release-tools

      - name: Validate exact publication evidence
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          SHA256="$(tr -d '\n' < "$TARBALL.sha256")"
          export SDK_TARBALL="$TARBALL"
          export SDK_TARBALL_SHA256="$SHA256"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "$TARBALL")" = "$SHA256"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" /tmp/candidate/candidate-manifest.json)" = "$(tr -d '\n' < /tmp/candidate/candidate-manifest.sha256)"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/candidate/candidate-manifest.json')).tarballSha256")" = "$SHA256"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" /tmp/gate-report/gate-report.json)" = "$(tr -d '\n' < /tmp/gate-report/gate-report.sha256)"
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { sha256Hex } from "/tmp/release-tools/scripts/digest-artifact.mjs";
          import {
            parseCanonicalJson,
            parseSha256Sidecar,
            validateGateReport,
          } from "/tmp/release-tools/scripts/report-validation.mjs";

          const [manifestSource, tarballSource, reportSource, reportSidecarSource] =
            await Promise.all([
              readFile("/tmp/candidate/candidate-manifest.json"),
              readFile(process.env.SDK_TARBALL),
              readFile("/tmp/gate-report/gate-report.json"),
              readFile("/tmp/gate-report/gate-report.sha256"),
            ]);
          const reportDigest = sha256Hex(reportSource);
          if (
            parseSha256Sidecar(reportSidecarSource, "Gate report sidecar") !==
            reportDigest
          ) {
            throw new TypeError("Gate report does not match its detached digest.");
          }
          const { value: report } = parseCanonicalJson(reportSource, "Gate report");
          validateGateReport({
            report,
            requiredGates: [
              "artifact",
              "installed-documentation-links",
              "documentation-workflows",
              "workerd",
              "deno",
              "bun",
              "live",
            ],
            expectedManifestSha256: sha256Hex(manifestSource),
            expectedTarballSha256: sha256Hex(tarballSource),
          });
