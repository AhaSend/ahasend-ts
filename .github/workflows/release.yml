        if: ${{ steps.retained_promotion_state.outcome == 'failure' }}
        with:
          name: promotion-state
          path: /tmp/promotion-state
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

      - name: Validate exact promotion evidence
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          SHA256="$(tr -d '\n' < "$TARBALL.sha256")"
          export SDK_TARBALL="$TARBALL"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "$TARBALL")" = "$SHA256"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" /tmp/candidate/candidate-manifest.json)" = "$(tr -d '\n' < /tmp/candidate/candidate-manifest.sha256)"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/candidate/candidate-manifest.json')).tarballSha256")" = "$SHA256"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" /tmp/gate-report/gate-report.json)" = "$(tr -d '\n' < /tmp/gate-report/gate-report.sha256)"
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { sha256Hex } from "/tmp/release-tools/scripts/digest-artifact.mjs";
          import {
            parseCanonicalJson,
            parseSha256Sidecar,
            validateGateReport,
          } from "/tmp/release-tools/scripts/report-validation.mjs";

          const [manifestSource, tarballSource, reportSource, reportSidecarSource] =
            await Promise.all([
              readFile("/tmp/candidate/candidate-manifest.json"),
              readFile(process.env.SDK_TARBALL),
              readFile("/tmp/gate-report/gate-report.json"),
              readFile("/tmp/gate-report/gate-report.sha256"),
            ]);
          const reportDigest = sha256Hex(reportSource);
          if (
            parseSha256Sidecar(reportSidecarSource, "Gate report sidecar") !==
            reportDigest
          ) {
            throw new TypeError("Gate report does not match its detached digest.");
          }
          const { value: report } = parseCanonicalJson(reportSource, "Gate report");
          validateGateReport({
            report,
            requiredGates: [
              "artifact",
              "installed-documentation-links",
              "documentation-workflows",
              "workerd",
              "deno",
              "bun",
              "live",
            ],
            expectedManifestSha256: sha256Hex(manifestSource),
            expectedTarballSha256: sha256Hex(tarballSource),
          });
          NODE

      - name: Promote only the verified version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          export SDK_TARBALL="$TARBALL"
          export SDK_TARBALL_SHA256="$(tr -d '\n' < "$TARBALL.sha256")"
          PACKAGE_JSON="$(tar -xzOf "$TARBALL" package/package.json)"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" /tmp/gate-report/gate-report.json)" = "$(tr -d '\n' < /tmp/gate-report/gate-report.sha256)"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/gate-report/gate-report.json')).tarballSha256")" = "$SDK_TARBALL_SHA256"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/candidate/candidate-manifest.json')).tarballSha256")" = "$SDK_TARBALL_SHA256"
          node /tmp/release-tools/scripts/promote-latest.mjs \
            "$(node -e "process.stdout.write(JSON.parse(process.argv[1]).name)" "$PACKAGE_JSON")" \
            "$(node -e "process.stdout.write(JSON.parse(process.argv[1]).version)" "$PACKAGE_JSON")"

  github-release:
    name: Publish GitHub Release
    needs: latest-promotion
    runs-on: ubuntu-latest
    environment: npm-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-report
          path: /tmp/source-report

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-tarball
          path: /tmp/candidate

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-manifest
          path: /tmp/candidate

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gate-report
          path: /tmp/gate-report

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tools
          path: /tmp/release-tools

      - name: Re-establish and verify latest before release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          SDK_TARBALL_SHA256="$(tr -d '\n' < "$TARBALL.sha256")"
          PACKAGE_JSON="$(tar -xzOf "$TARBALL" package/package.json)"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "$TARBALL")" = "$SDK_TARBALL_SHA256"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/gate-report/gate-report.json')).tarballSha256")" = "$SDK_TARBALL_SHA256"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/candidate/candidate-manifest.json')).tarballSha256")" = "$SDK_TARBALL_SHA256"
          node /tmp/release-tools/scripts/promote-latest.mjs \
            "$(node -e "process.stdout.write(JSON.parse(process.argv[1]).name)" "$PACKAGE_JSON")" \
            "$(node -e "process.stdout.write(JSON.parse(process.argv[1]).version)" "$PACKAGE_JSON")"

      - name: Stage and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          export SDK_TARBALL="$TARBALL"
          export SDK_TARBALL_SHA256="$(tr -d '\n' < "$TARBALL.sha256")"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "$TARBALL")" = "$SDK_TARBALL_SHA256"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/gate-report/gate-report.json')).tarballSha256")" = "$SDK_TARBALL_SHA256"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/candidate/candidate-manifest.json')).tarballSha256")" = "$SDK_TARBALL_SHA256"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            /tmp/candidate/*.tgz \
            /tmp/candidate/*.tgz.sha256 \
            /tmp/candidate/candidate-manifest.json \
            /tmp/candidate/candidate-manifest.sha256 \
            /tmp/source-report/source-report.json \
            /tmp/source-report/source-report.sha256 \
            /tmp/gate-report/gate-report.json \
            /tmp/gate-report/gate-report.sha256 \
            /tmp/gate-report/live-report.json \
            /tmp/gate-report/live-report.sha256
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

  release-compensation:
    name: Compensate failed terminal release
    needs: [latest-promotion, github-release]
    if: ${{ always() && needs.latest-promotion.result != 'skipped' && (needs.latest-promotion.result != 'success' || needs.github-release.result != 'success') }}
    runs-on: ubuntu-latest
    environment: npm-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-tarball
          path: /tmp/candidate

      # Tolerating a failed download keeps the cleanup below reachable —
      # otherwise a latest-promotion failure *before* the state upload (the
      # capture step, an evidence check) made this job fail right here,
      # skipping the GitHub-release removal it can still perform. The download
      # cannot distinguish "never uploaded" from "exists but the download
      # failed", so the restore step treats a missing file as UNKNOWN state
      # and fails the job after cleaning up, rather than declaring latest
      # untouched.
      - continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: promotion-state
          path: /tmp/promotion-state

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tools
          path: /tmp/release-tools

      - name: Restore latest and remove an incomplete release
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          FAILED=0
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          PACKAGE_JSON="$(tar -xzOf "$TARBALL" package/package.json)"
          PACKAGE_NAME="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).name)" "$PACKAGE_JSON")"
          # Every branch keeps the gh-release cleanup below reachable, and
          # only a completed restore counts as success: a missing state file
          # means "never uploaded, OR the download of an existing one failed"
          # — indistinguishable here — and an unusable one proves nothing
          # either, so both mark the job failed after cleanup instead of
          # silently declaring latest untouched.
          if ! test -f /tmp/promotion-state/promotion-state.json
          then
            echo "promotion-state unavailable (never uploaded, or its download failed): verify npm dist-tags manually" >&2
            FAILED=1
          elif STATE_NAME="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/promotion-state/promotion-state.json')).name" 2>/dev/null)" \
            && PREVIOUS_LATEST="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/promotion-state/promotion-state.json')).previousLatest || ''" 2>/dev/null)" \
            && test "$STATE_NAME" = "$PACKAGE_NAME"
          then
            node /tmp/release-tools/scripts/restore-latest.mjs \
              "$PACKAGE_NAME" "$PREVIOUS_LATEST" || FAILED=1
          else
            echo "promotion-state present but unusable (unparseable, or naming another package): verify npm dist-tags manually" >&2
            FAILED=1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes || FAILED=1
          fi
          exit "$FAILED"
