# Publishes @ahasend/sdk to npm with provenance when a GitHub release is
# published.
#
# Setup (one-time, on npmjs.com): configure this repository +
# `release.yml` as a Trusted Publisher for the @ahasend/sdk package.
# With trusted publishing, no NPM_TOKEN secret is needed — the OIDC
# id-token below authenticates the publish, and `--provenance` links the
# published tarball back to this exact workflow run.

name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Verify (typecheck + lint + tests + build)
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Integration suite against disposable packed SDK
        run: npm run test:integration:preflight

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
