name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  RETENTION_DAYS: "30"

jobs:
  source-gate:
    name: Source gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - run: npm ci

      - name: Verify tag and source revision
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Generation gate
        run: npm run contracts:check && npm run sdk:check && npm run docs:check

      - name: Typecheck gate
        run: npm run typecheck

      - name: Typed lint gate
        run: npm run lint

      - name: Unit test gate
        run: npm run test:unit -- tests/openapi-authoritative-contract.test.ts

      - name: State test gate
        run: npx vitest run tests/state-machines.test.ts

      - name: Webhook test gate
        run: npx vitest run tests/webhooks.test.ts tests/webhook-adapters.test.ts tests/webhook-types.test.ts

      - name: Framework test gate
        run: npx vitest run tests/webhook-express.integration.test.ts

      - name: Coverage gate
        run: npm run test:coverage

      - name: Format gate
        run: npx prettier --check "src/**/*.ts" "tests/**/*.ts"

      - name: Test policy gate
        run: npm run test:policy

      - name: Repository secret-scan gate
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFile } from "node:fs/promises";
          import { SECRET_PATTERNS } from "./scripts/secret-patterns.mjs";

          const policy = JSON.parse(await readFile("security/secret-scan-allowlist.json", "utf8"));
          const allowed = new Set(policy.rules.map((rule) => rule.allowedPath));
          const paths = execFileSync("git", ["ls-files", "-z"], { encoding: "utf8" })
            .split("\0")
            .filter(Boolean);
          for (const path of paths) {
            if (allowed.has(path)) continue;
            const source = await readFile(path, "utf8");
            if (SECRET_PATTERNS.some((pattern) => pattern.test(source))) {
              throw new TypeError(`Repository contains an unclassified secret in ${path}.`);
            }
          }
          NODE

      - name: Audit gate
        run: npm run verify:audit

      - name: Documentation workflow gate
        run: npm run test:docs:workflows:source

      - name: Create detached source report
        run: |
          mkdir -p /tmp/source-report
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { canonicalizeJson, sha256Hex } from "./scripts/digest-artifact.mjs";
          import {
            readRepositorySourceBindings,
            REQUIRED_SOURCE_GATES,
            validateSourceGateReport,
          } from "./scripts/run-source-gates.mjs";

          const bindings = await readRepositorySourceBindings();
          const source = canonicalizeJson({
            version: 1,
            ...bindings,
            results: REQUIRED_SOURCE_GATES.map((name) => ({ name, passed: true })),
          });
          const sidecar = Buffer.from(`${sha256Hex(source)}\n`, "utf8");
          validateSourceGateReport({
            reportSource: source,
            reportSidecar: sidecar,
            expectedBindings: bindings,
          });
          await Promise.all([
            writeFile("/tmp/source-report/source-report.json", source, { flag: "wx" }),
            writeFile("/tmp/source-report/source-report.sha256", sidecar, { flag: "wx" }),
          ]);
          NODE

      - name: Retain provenance verification tools
        run: |
          mkdir -p /tmp/release-tools/scripts
          cp scripts/digest-artifact.mjs /tmp/release-tools/scripts/
          cp scripts/promote-latest.mjs /tmp/release-tools/scripts/
          cp scripts/report-validation.mjs /tmp/release-tools/scripts/
          cp scripts/restore-latest.mjs /tmp/release-tools/scripts/
          cp scripts/verify-provenance.mjs /tmp/release-tools/scripts/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-report
          path: |
            /tmp/source-report/source-report.json
            /tmp/source-report/source-report.sha256
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tools
          path: /tmp/release-tools
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

  candidate:
    name: Build candidate once
    needs: source-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-report
          path: /tmp/source-report

      - name: Build and pack the retained candidate
        run: |
          node scripts/create-candidate.mjs \
            /tmp/source-report/source-report.json \
            /tmp/candidate \
            /tmp/source-report/source-report.sha256
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          SHA256="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/candidate/candidate-manifest.json')).tarballSha256")"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "$TARBALL")" = "$SHA256"
          printf '%s\n' "$SHA256" > "$TARBALL.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-tarball
          path: |
            /tmp/candidate/*.tgz
            /tmp/candidate/*.tgz.sha256
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-manifest
          path: |
            /tmp/candidate/candidate-manifest.json
            /tmp/candidate/candidate-manifest.sha256
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

  artifact-gates:
    name: Artifact gates
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-tarball
          path: /tmp/candidate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-manifest
          path: /tmp/candidate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-report
          path: /tmp/source-report

      - name: Verify retained package artifact
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          SHA256="$(tr -d '\n' < "$TARBALL.sha256")"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" /tmp/candidate/candidate-manifest.json)" = "$(tr -d '\n' < /tmp/candidate/candidate-manifest.sha256)"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/candidate/candidate-manifest.json')).tarballSha256")" = "$SHA256"
          node scripts/verify-doc-workflows.mjs --artifact \
            "$TARBALL" \
            "$SHA256" \
            /tmp/source-report/source-report.json \
            /tmp/source-report/source-report.sha256

  live-gates:
    name: Live candidate gates
    needs: artifact-gates
    runs-on: ubuntu-latest
    environment: live-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-tarball
          path: /tmp/candidate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-manifest
          path: /tmp/candidate

      - name: Run live candidate acceptance
        env:
          AHASEND_API_KEY: ${{ secrets.AHASEND_API_KEY }}
          AHASEND_ACCOUNT_ID: ${{ secrets.AHASEND_ACCOUNT_ID }}
          AHASEND_LIVE_CONFIG_JSON: ${{ secrets.AHASEND_LIVE_CONFIG_JSON }}
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          export SDK_TARBALL="$TARBALL"
          export SDK_TARBALL_SHA256="$(tr -d '\n' < "$TARBALL.sha256")"
          mkdir -p /tmp/gate-report
          node scripts/run-live-acceptance.mjs \
            /tmp/candidate/candidate-manifest.json \
            "$TARBALL" \
            /tmp/live-install \
            /tmp/gate-report/live-report.json \
            /tmp/gate-report/live-report.sha256 \
            /tmp/candidate/candidate-manifest.sha256

      - name: Create detached gate report
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          import { canonicalizeJson, sha256Hex } from "./scripts/digest-artifact.mjs";

          const manifestSource = await readFile("/tmp/candidate/candidate-manifest.json");
          const liveReportSource = await readFile("/tmp/gate-report/live-report.json");
          const liveReportSha256 = (
            await readFile("/tmp/gate-report/live-report.sha256", "utf8")
          ).trim();
          if (sha256Hex(liveReportSource) !== liveReportSha256) {
            throw new TypeError("Live report does not match its detached digest.");
          }
          const manifest = JSON.parse(manifestSource);
          const source = canonicalizeJson({
            version: 1,
            commit: manifest.commit,
            manifestSha256: sha256Hex(manifestSource),
            tarballSha256: manifest.tarballSha256,
            liveReportSha256,
            results: [
              { name: "artifact", passed: true },
              { name: "live", passed: true },
            ],
          });
          await Promise.all([
            writeFile("/tmp/gate-report/gate-report.json", source, { flag: "wx" }),
            writeFile(
              "/tmp/gate-report/gate-report.sha256",
              `${sha256Hex(source)}\n`,
              { flag: "wx" },
            ),
          ]);
          NODE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-report
          path: /tmp/gate-report
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

  next-publish:
    name: Publish candidate to next
    needs: live-gates
    runs-on: ubuntu-latest
    environment: npm-next
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-tarball
          path: /tmp/candidate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-manifest
          path: /tmp/candidate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gate-report
          path: /tmp/gate-report

      - name: Publish the retained bytes with provenance
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          SHA256="$(tr -d '\n' < "$TARBALL.sha256")"
          export SDK_TARBALL="$TARBALL"
          export SDK_TARBALL_SHA256="$SHA256"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "$TARBALL")" = "$SHA256"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" /tmp/candidate/candidate-manifest.json)" = "$(tr -d '\n' < /tmp/candidate/candidate-manifest.sha256)"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/candidate/candidate-manifest.json')).tarballSha256")" = "$SHA256"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" /tmp/gate-report/gate-report.json)" = "$(tr -d '\n' < /tmp/gate-report/gate-report.sha256)"
          npm publish "$TARBALL" --tag next --provenance --access public

  registry-smoke:
    name: Registry integrity and provenance smoke
    needs: next-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-tarball
          path: /tmp/candidate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-manifest
          path: /tmp/candidate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tools
          path: /tmp/release-tools

      - name: Download the published registry bytes
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          PACKAGE_JSON="$(tar -xzOf "$TARBALL" package/package.json)"
          PACKAGE="$(node -e "const p=JSON.parse(process.argv[1]); process.stdout.write(p.name+'@'+p.version)" "$PACKAGE_JSON")"
          mkdir -p /tmp/registry
          for ATTEMPT in 1 2 3 4 5
          do
            if npm view "$PACKAGE" --json > /tmp/registry/metadata.json
            then
              break
            fi
            test "$ATTEMPT" -lt 5
            sleep 5
          done
          REGISTRY_TARBALL_URL="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1])).dist.tarball)" /tmp/registry/metadata.json)"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$REGISTRY_TARBALL_URL" --output /tmp/registry/package.tgz

      - name: Cryptographically verify npm attestations
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          export SDK_TARBALL="$TARBALL"
          export SDK_TARBALL_SHA256="$(tr -d '\n' < "$TARBALL.sha256")"
          PACKAGE_JSON="$(tar -xzOf "$TARBALL" package/package.json)"
          PACKAGE="$(node -e "const p=JSON.parse(process.argv[1]); process.stdout.write(p.name+'@'+p.version)" "$PACKAGE_JSON")"
          mkdir -p /tmp/registry-audit
          node -e "const fs=require('fs'); const [name,version]=process.argv.slice(1); fs.writeFileSync('/tmp/registry-audit/package.json', JSON.stringify({name:'ahasend-registry-smoke',private:true,version:'1.0.0',dependencies:{[name]:version}}))" \
            "$(node -e "process.stdout.write(JSON.parse(process.argv[1]).name)" "$PACKAGE_JSON")" \
            "$(node -e "process.stdout.write(JSON.parse(process.argv[1]).version)" "$PACKAGE_JSON")"
          npm install --ignore-scripts --package-lock-only --prefix /tmp/registry-audit
          npm ci --ignore-scripts --prefix /tmp/registry-audit
          npm audit signatures --json --include-attestations --prefix /tmp/registry-audit \
            > /tmp/registry/npm-audit-signatures.json
          node /tmp/release-tools/scripts/verify-provenance.mjs \
            "$TARBALL" \
            /tmp/candidate/candidate-manifest.json \
            /tmp/candidate/candidate-manifest.sha256 \
            /tmp/registry/package.tgz \
            /tmp/registry/metadata.json \
            /tmp/registry/npm-audit-signatures.json

  latest-promotion:
    name: Promote verified candidate to latest
    needs: registry-smoke
    runs-on: ubuntu-latest
    environment: npm-latest
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-tarball
          path: /tmp/candidate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-manifest
          path: /tmp/candidate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gate-report
          path: /tmp/gate-report

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tools
          path: /tmp/release-tools

      - name: Reuse retained promotion state
        id: retained_promotion_state
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: promotion-state
          path: /tmp/promotion-state

      - name: Capture the prior latest tag
        if: ${{ steps.retained_promotion_state.outcome == 'failure' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          PACKAGE_JSON="$(tar -xzOf "$TARBALL" package/package.json)"
          PACKAGE_NAME="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).name)" "$PACKAGE_JSON")"
          PREVIOUS_LATEST="$(npm view "$PACKAGE_NAME" dist-tags.latest)"
          mkdir -p /tmp/promotion-state
          node -e "const fs=require('fs'); const [name,previous]=process.argv.slice(1); fs.writeFileSync('/tmp/promotion-state/promotion-state.json', JSON.stringify({name,previousLatest:previous || null})+'\\n', {flag:'wx'})" \
            "$PACKAGE_NAME" "$PREVIOUS_LATEST"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ steps.retained_promotion_state.outcome == 'failure' }}
        with:
          name: promotion-state
          path: /tmp/promotion-state
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

      - name: Promote only the verified version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          export SDK_TARBALL="$TARBALL"
          export SDK_TARBALL_SHA256="$(tr -d '\n' < "$TARBALL.sha256")"
          PACKAGE_JSON="$(tar -xzOf "$TARBALL" package/package.json)"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" /tmp/gate-report/gate-report.json)" = "$(tr -d '\n' < /tmp/gate-report/gate-report.sha256)"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/gate-report/gate-report.json')).tarballSha256")" = "$SDK_TARBALL_SHA256"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/candidate/candidate-manifest.json')).tarballSha256")" = "$SDK_TARBALL_SHA256"
          node /tmp/release-tools/scripts/promote-latest.mjs \
            "$(node -e "process.stdout.write(JSON.parse(process.argv[1]).name)" "$PACKAGE_JSON")" \
            "$(node -e "process.stdout.write(JSON.parse(process.argv[1]).version)" "$PACKAGE_JSON")"

  github-release:
    name: Publish GitHub Release
    needs: latest-promotion
    runs-on: ubuntu-latest
    environment: npm-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-report
          path: /tmp/source-report

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-tarball
          path: /tmp/candidate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-manifest
          path: /tmp/candidate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gate-report
          path: /tmp/gate-report

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tools
          path: /tmp/release-tools

      - name: Re-establish and verify latest before release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          SDK_TARBALL_SHA256="$(tr -d '\n' < "$TARBALL.sha256")"
          PACKAGE_JSON="$(tar -xzOf "$TARBALL" package/package.json)"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "$TARBALL")" = "$SDK_TARBALL_SHA256"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/gate-report/gate-report.json')).tarballSha256")" = "$SDK_TARBALL_SHA256"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/candidate/candidate-manifest.json')).tarballSha256")" = "$SDK_TARBALL_SHA256"
          node /tmp/release-tools/scripts/promote-latest.mjs \
            "$(node -e "process.stdout.write(JSON.parse(process.argv[1]).name)" "$PACKAGE_JSON")" \
            "$(node -e "process.stdout.write(JSON.parse(process.argv[1]).version)" "$PACKAGE_JSON")"

      - name: Stage and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          export SDK_TARBALL="$TARBALL"
          export SDK_TARBALL_SHA256="$(tr -d '\n' < "$TARBALL.sha256")"
          test "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "$TARBALL")" = "$SDK_TARBALL_SHA256"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/gate-report/gate-report.json')).tarballSha256")" = "$SDK_TARBALL_SHA256"
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/candidate/candidate-manifest.json')).tarballSha256")" = "$SDK_TARBALL_SHA256"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            /tmp/candidate/*.tgz \
            /tmp/candidate/*.tgz.sha256 \
            /tmp/candidate/candidate-manifest.json \
            /tmp/candidate/candidate-manifest.sha256 \
            /tmp/source-report/source-report.json \
            /tmp/source-report/source-report.sha256 \
            /tmp/gate-report/gate-report.json \
            /tmp/gate-report/gate-report.sha256 \
            /tmp/gate-report/live-report.json \
            /tmp/gate-report/live-report.sha256
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

  release-compensation:
    name: Compensate failed terminal release
    needs: [latest-promotion, github-release]
    if: ${{ always() && needs.latest-promotion.result != 'skipped' && (needs.latest-promotion.result != 'success' || needs.github-release.result != 'success') }}
    runs-on: ubuntu-latest
    environment: npm-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-tarball
          path: /tmp/candidate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: promotion-state
          path: /tmp/promotion-state

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tools
          path: /tmp/release-tools

      - name: Restore latest and remove an incomplete release
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          FAILED=0
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          PACKAGE_JSON="$(tar -xzOf "$TARBALL" package/package.json)"
          PACKAGE_NAME="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).name)" "$PACKAGE_JSON")"
          STATE_NAME="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/promotion-state/promotion-state.json')).name")"
          PREVIOUS_LATEST="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/promotion-state/promotion-state.json')).previousLatest || ''")"
          test "$STATE_NAME" = "$PACKAGE_NAME"
          node /tmp/release-tools/scripts/restore-latest.mjs \
            "$PACKAGE_NAME" "$PREVIOUS_LATEST" || FAILED=1
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes || FAILED=1
          fi
          exit "$FAILED"
