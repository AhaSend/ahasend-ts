  registry-smoke:
    name: Registry integrity and provenance smoke
    needs: next-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-tarball
          path: /tmp/candidate

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-manifest
          path: /tmp/candidate

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tools
          path: /tmp/release-tools

      - name: Download the published registry bytes
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          PACKAGE_JSON="$(tar -xzOf "$TARBALL" package/package.json)"
          PACKAGE_NAME="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).name)" "$PACKAGE_JSON")"
          PACKAGE_VERSION="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).version)" "$PACKAGE_JSON")"
          test "$PACKAGE_NAME" = "@ahasend/sdk"
          PACKAGE="$PACKAGE_NAME@$PACKAGE_VERSION"
          mkdir -p /tmp/registry
          for ATTEMPT in 1 2 3 4 5
          do
            if npm view "$PACKAGE" --json > /tmp/registry/metadata.json
            then
              break
            fi
            test "$ATTEMPT" -lt 5
            sleep 5
          done
          REGISTRY_TARBALL_URL="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1])).dist.tarball)" /tmp/registry/metadata.json)"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$REGISTRY_TARBALL_URL" --output /tmp/registry/package.tgz

      - name: Install the exact registry version in a clean directory
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          PACKAGE_JSON="$(tar -xzOf "$TARBALL" package/package.json)"
          PACKAGE_NAME="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).name)" "$PACKAGE_JSON")"
          PACKAGE_VERSION="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).version)" "$PACKAGE_JSON")"
          test "$PACKAGE_NAME" = "@ahasend/sdk"
          PACKAGE="$PACKAGE_NAME@$PACKAGE_VERSION"
          mkdir /tmp/registry-smoke
          node -e "const fs=require('fs'); fs.writeFileSync('/tmp/registry-smoke/package.json', JSON.stringify({name:'ahasend-registry-smoke',private:true,version:'1.0.0'}))"
          for ATTEMPT in 1 2 3 4 5
          do
            if npm install --ignore-scripts --save-exact "$PACKAGE" --prefix /tmp/registry-smoke
            then
              break
            fi
            test "$ATTEMPT" -lt 5
            sleep 5
          done
          test "$(node -p "require('/tmp/registry-smoke/node_modules/@ahasend/sdk/package.json').version")" = "$PACKAGE_VERSION"

      - name: Verify registry bytes and npm provenance
        run: |
          TARBALL="$(find /tmp/candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          export SDK_TARBALL="$TARBALL"
          export SDK_TARBALL_SHA256="$(tr -d '\n' < "$TARBALL.sha256")"
          npm audit signatures --json --include-attestations --prefix /tmp/registry-smoke \
            > /tmp/registry/npm-audit-signatures.json
          node /tmp/release-tools/scripts/verify-provenance.mjs \
            "$TARBALL" \
            /tmp/candidate/candidate-manifest.json \
            /tmp/candidate/candidate-manifest.sha256 \
            /tmp/registry/package.tgz \
            /tmp/registry/metadata.json \
            /tmp/registry/npm-audit-signatures.json

      - name: Run ESM first-use smoke
        working-directory: /tmp/registry-smoke
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { AhaSendClient } from "@ahasend/sdk";

          const accountId = "11111111-1111-4111-8111-111111111111";
          const calls = [];
          const stubFetch = async (input, init = {}) => {
            const url = new URL(input);
            calls.push({ method: init.method, pathname: url.pathname });
            if (url.pathname === "/v2/ping") {
              return Response.json({ message: "pong" });
            }
            if (url.pathname === `/v2/accounts/${accountId}/domains`) {
              return Response.json(
                { object: "list", data: [], pagination: { has_more: false } },
                { headers: { "x-request-id": "req_registry_esm" } },
              );
            }
            return Response.json({ message: "unexpected request" }, { status: 500 });
          };
          const client = new AhaSendClient({
            apiKey: "aha-sk-registry-smoke",
            accountId,
            baseUrl: "https://api.registry-smoke.test",
            fetch: stubFetch,
            retry: { enabled: false },
          });

          assert.equal(client.accountId, accountId);
          assert.deepEqual(await client.ping(), { message: "pong" });
          const domains = await client.domains.list({ limit: 1 }).withResponse();
          assert.deepEqual(domains.data, {
            object: "list",
            data: [],
            pagination: { has_more: false },
          });
          assert.equal(domains.response.status, 200);
          assert.equal(domains.requestId, "req_registry_esm");
          assert.deepEqual(calls, [
            { method: "GET", pathname: "/v2/ping" },
            { method: "GET", pathname: `/v2/accounts/${accountId}/domains` },
          ]);
          NODE

      - name: Run CommonJS first-use smoke
        working-directory: /tmp/registry-smoke
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const { AhaSendClient } = require("@ahasend/sdk");

          const accountId = "11111111-1111-4111-8111-111111111111";
          const calls = [];
          const stubFetch = async (input, init = {}) => {
            const url = new URL(input);
            calls.push({ method: init.method, pathname: url.pathname });
            if (url.pathname === "/v2/ping") {
              return Response.json({ message: "pong" });
            }
            if (url.pathname === `/v2/accounts/${accountId}/domains`) {
              return Response.json(
                { object: "list", data: [], pagination: { has_more: false } },
                { headers: { "x-request-id": "req_registry_cjs" } },
              );
            }
            return Response.json({ message: "unexpected request" }, { status: 500 });
          };
          const client = new AhaSendClient({
            apiKey: "aha-sk-registry-smoke",
            accountId,
            baseUrl: "https://api.registry-smoke.test",
            fetch: stubFetch,
            retry: { enabled: false },
          });

          async function main() {
            assert.equal(client.accountId, accountId);
            assert.deepEqual(await client.ping(), { message: "pong" });
            const domains = await client.domains.list({ limit: 1 }).withResponse();
            assert.deepEqual(domains.data, {
              object: "list",
              data: [],
              pagination: { has_more: false },
            });
            assert.equal(domains.response.status, 200);
            assert.equal(domains.requestId, "req_registry_cjs");
            assert.deepEqual(calls, [
              { method: "GET", pathname: "/v2/ping" },
              { method: "GET", pathname: `/v2/accounts/${accountId}/domains` },
            ]);
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

  latest-promotion:
    name: Promote verified candidate to latest
    needs: [live-gates, registry-smoke]
    if: ${{ needs.live-gates.result == 'success' && needs.registry-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    environment: npm-latest
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-tarball
          path: /tmp/candidate

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-manifest
          path: /tmp/candidate

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gate-report
