name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            experimental: false
          - node: 24
            experimental: false
          - node: 26
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - run: npm ci

      - name: Required source gates and packed preflights
        run: npm run ci

      - name: Documented workflow gate
        run: npm run test:docs:workflows:source

  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - run: npm ci

      - name: Coverage (thresholds enforced in vitest.config.ts)
        run: npm run test:coverage
