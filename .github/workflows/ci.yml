name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            experimental: false
          - node: 24
            experimental: false
          - node: 26
            experimental: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - name: Install dependencies
        run: npm ci

      - name: Required source gates and packed preflights
        run: npm run ci

      - name: Documented workflow gate
        run: npm run test:docs:workflows:source

  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - name: Install dependencies
        run: npm ci

      - name: Coverage (thresholds enforced in vitest.config.ts)
        run: npm run test:coverage

  workerd:
    name: workerd shared conformance (no nodejs_compat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - name: Install dependencies
        run: npm ci

      - name: Run maintained workerd conformance
        run: npm run test:conformance:workerd

  deno:
    name: Deno 2.x packed smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - name: Install dependencies
        run: npm ci

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: 2.x

      - name: Build candidate tarball
        id: pack
        run: |
          npm run build
          mkdir -p "$RUNNER_TEMP/ahasend-runtime-smoke"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/ahasend-runtime-smoke"
          TARBALL="$(find "$RUNNER_TEMP/ahasend-runtime-smoke" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Run maintained Deno packed smoke
        run: npm run test:runtime:deno -- "${{ steps.pack.outputs.tarball }}"

  bun:
    name: Bun packed smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install asserted npm version
        run: npm install --global npm@11.12.0

      - name: Verify asserted npm version
        run: test "$(npm --version)" = "11.12.0"

      - name: Install dependencies
        run: npm ci

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Build candidate tarball
        id: pack
        run: |
          npm run build
          mkdir -p "$RUNNER_TEMP/ahasend-runtime-smoke"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/ahasend-runtime-smoke"
          TARBALL="$(find "$RUNNER_TEMP/ahasend-runtime-smoke" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Run maintained Bun packed smoke
        run: npm run test:runtime:bun -- "${{ steps.pack.outputs.tarball }}"
